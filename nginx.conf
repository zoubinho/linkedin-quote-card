server {
    listen       5540;
    listen  [::]:5540;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve the single-page app; fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entrypoint so redeploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
